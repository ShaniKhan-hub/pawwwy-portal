spring.application.name=pawwwy-portal

# Port: honors Render's $PORT env var when deployed (usually 10000),
# defaults to 8090 locally — same logic as hostelbills.
server.port=${PORT:8090}

# Jackson — omit nulls (e.g. iframeUrl is null for drop-in modules)
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.pawwwy=INFO

# ──────────────────────────────────────────────────────────────────────────────
# Module iframe URLs — config-driven so deployments can be swapped without
# rebuilding. Override these via env vars in production (Render dashboard):
#
#   PAWWWY_MODULES_CATSWEEPER_URL = https://catsweeper-prod.onrender.com
#   PAWWWY_MODULES_PAWWWY_GAMES_URL = ...
#   PAWWWY_MODULES_HOSTELBILLS_URL = ...
#
# Defaults below are placeholder Render URLs; replace once each module is live.
# ──────────────────────────────────────────────────────────────────────────────

pawwwy.modules.catsweeper-url=https://catsweeper.onrender.com
pawwwy.modules.pawwwy-games-url=https://pawwwy-games.onrender.com
pawwwy.modules.hostelbills-url=https://hostelbills.onrender.com
