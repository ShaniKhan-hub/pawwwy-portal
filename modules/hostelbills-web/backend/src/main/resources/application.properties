spring.application.name=hostelbills-web

# Port: honors Render's $PORT env var when deployed (usually 10000),
# defaults to 8091 locally so it doesn't clash with Catsweeper (8080) or
# the portal backend (8090).
server.port=${PORT:8091}

# Jackson — keep nulls out of JSON
spring.jackson.default-property-inclusion=non_null

logging.level.com.pawwwy=INFO
